services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend/uploads:/app/backend/uploads
      - ../backend/transcripts:/app/backend/transcripts
      - ../backend/app/database/chromadb:/app/backend/app/database/chromadb
    depends_on:
      - ollama

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ollama:
